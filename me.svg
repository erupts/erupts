<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260">
    <style>
        text {
            font-family: ui-monospace, 'SFMono-Regular', Menlo, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
        }

        .muted  { fill: #7d8590; }
        .cyan   { fill: #4FC8EC; }
        .white  { fill: #e6edf3; }

        .name {
            font-size: 58px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .line   { font-size: 19px; }
        .title  { font-size: 13px; letter-spacing: 2px; }

        /* content is visible by default; animations replay the "typing" as an enhancement */
        .fade-1 { animation: appear .01s linear 1.6s both; }
        .fade-2 { animation: appear .01s linear 2.0s both; }
        .fade-3 { animation: appear .01s linear 2.4s both; }

        .cover {
            fill: #0b0e14;
            transform: translateX(344px);
            animation: type 1.4s steps(26) .2s both;
        }

        .cursor {
            fill: #4FC8EC;
            animation: appear .01s linear 2.4s both, blink 1.1s step-end 2.4s infinite;
        }

        @keyframes type   { from { transform: translateX(0); } to { transform: translateX(344px); } }
        @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
        @keyframes blink  { 50% { opacity: 0; } }
    </style>

    <defs>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- terminal window -->
    <rect x="60" y="10" width="800" height="238" rx="14" fill="#0b0e14" stroke="#1f2630" filter="url(#shadow)"/>

    <!-- title bar -->
    <circle cx="94"  cy="40" r="6.5" fill="#ff5f57"/>
    <circle cx="116" cy="40" r="6.5" fill="#febc2e"/>
    <circle cx="138" cy="40" r="6.5" fill="#28c840"/>
    <text class="muted title" x="460" y="45" text-anchor="middle">yuepeng — zsh</text>
    <line x1="60" y1="62" x2="860" y2="62" stroke="#1f2630"/>

    <!-- $ whoami (typed) -->
    <text class="line" x="100" y="102"><tspan class="cyan">yuepeng@github</tspan><tspan class="muted"> ~ % </tspan><tspan class="white">whoami</tspan></text>
    <rect class="cover" x="96" y="82" width="344" height="30"/>

    <!-- output -->
    <text class="name white fade-1" x="98" y="168">YuePeng</text>
    <text class="line cyan fade-2" x="100" y="202">› open source · low-code · creator of erupt &amp; linq.j</text>

    <!-- next prompt -->
    <text class="line fade-3" x="100" y="234"><tspan class="cyan">yuepeng@github</tspan><tspan class="muted"> ~ % </tspan></text>
    <rect class="cursor" x="312" y="220" width="11" height="19"/>
</svg>
