<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="less code — open source · low-code">
    <style>
        text { font-family: ui-monospace, 'SFMono-Regular', Menlo, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }

        .name  { font-size: 76px; font-weight: 800; letter-spacing: 2px; }
        .tag   { font-size: 14px; letter-spacing: 7px; fill: #05d9e8; }
        .sub   { font-size: 16px; letter-spacing: 1px; fill: #ff2a6d; }

        .cyan  { fill: #05d9e8; }
        .pink  { fill: #ff2a6d; }
        .white { fill: #eafcff; }

        /* glitch: the offset color-split copies jitter horizontally */
        .gC { animation: gC 2.6s steps(1) infinite; }
        .gP { animation: gP 2.6s steps(1) infinite; }
        @keyframes gC {
            0%,88%,100% { transform: translateX(-3px); }
            90% { transform: translate(-9px,2px); }
            94% { transform: translate(2px,-2px); }
        }
        @keyframes gP {
            0%,88%,100% { transform: translateX(3px); }
            90% { transform: translate(8px,-2px); }
            94% { transform: translate(-3px,2px); }
        }

        /* glitch slice — a clipped band of the name flickers sideways */
        .slice { animation: slice 3.4s steps(1) infinite; }
        @keyframes slice {
            0%,92%,100% { transform: translateX(0); opacity: 0; }
            93% { transform: translateX(10px); opacity: 1; }
            96% { transform: translateX(-8px); opacity: 1; }
            98% { opacity: 0; }
        }

        .cursor { fill: #f9f002; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .flow { stroke-dasharray: 4 10; animation: flow 3s linear infinite; }
        @keyframes flow { to { stroke-dashoffset: -28; } }

        /* grid floor scrolls toward the viewer */
        .floor line { animation: floor 2.4s linear infinite; }
        @keyframes floor { to { stroke-dashoffset: -34; } }

        .star { fill: #eafcff; animation: twinkle 3s ease-in-out infinite; }
        @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    </style>

    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#0d0221"/>
            <stop offset=".6"  stop-color="#160a2e"/>
            <stop offset="1"   stop-color="#2a0845"/>
        </linearGradient>
        <linearGradient id="sunFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#f9f002"/>
            <stop offset=".5"  stop-color="#ff7a3d"/>
            <stop offset="1"   stop-color="#ff2a6d"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ff2a6d" stop-opacity=".7"/>
            <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
            <stop offset="1" stop-color="#fff" stop-opacity="1"/>
        </linearGradient>
        <mask id="gridFade"><rect x="0" y="200" width="900" height="100" fill="url(#fade)"/></mask>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="1.4" fill="#000" opacity=".28"/>
        </pattern>
        <clipPath id="panelClip"><rect x="6" y="6" width="888" height="288" rx="6"/></clipPath>
        <clipPath id="sunClip"><rect x="0" y="0" width="900" height="200"/></clipPath>
        <clipPath id="sunDisc"><circle cx="700" cy="200" r="88"/></clipPath>
        <clipPath id="sliceClip"><rect x="0" y="94" width="520" height="16"/></clipPath>
    </defs>

    <!-- panel -->
    <rect x="6" y="6" width="888" height="288" rx="6" fill="url(#sky)" stroke="#ff2a6d" stroke-width="1.5"/>

    <g clip-path="url(#panelClip)">
        <!-- stars -->
        <g>
            <circle class="star" cx="560" cy="40"  r="1.2"/>
            <circle class="star" cx="612" cy="92"  r="1"   style="animation-delay:.6s"/>
            <circle class="star" cx="668" cy="34"  r="1.6" style="animation-delay:1.2s"/>
            <circle class="star" cx="730" cy="70"  r="1"   style="animation-delay:.3s"/>
            <circle class="star" cx="790" cy="46"  r="1.4" style="animation-delay:1.8s"/>
            <circle class="star" cx="842" cy="98"  r="1"   style="animation-delay:.9s"/>
            <circle class="star" cx="860" cy="30"  r="1.2" style="animation-delay:2.2s"/>
            <circle class="star" cx="820" cy="150" r="1"   style="animation-delay:1.5s"/>
            <circle class="star" cx="590" cy="140" r="1"   style="animation-delay:2.6s"/>
            <circle class="star" cx="480" cy="52"  r="1.2" style="animation-delay:.4s"/>
            <circle class="star" cx="300" cy="36"  r="1"   style="animation-delay:1.1s"/>
            <circle class="star" cx="140" cy="44"  r="1.2" style="animation-delay:2s"/>
            <circle class="star" cx="60"  cy="92"  r="1"   style="animation-delay:.8s"/>
            <circle class="star" cx="880" cy="178" r="1"   style="animation-delay:1.3s"/>
        </g>

        <!-- setting sun -->
        <ellipse cx="700" cy="200" rx="200" ry="130" fill="url(#sunGlow)"/>
        <g clip-path="url(#sunClip)">
            <circle cx="700" cy="200" r="88" fill="url(#sunFill)"/>
            <!-- horizon stripes cut into the disc -->
            <g fill="#160a2e" clip-path="url(#sunDisc)">
                <rect x="600" y="146" width="200" height="3"/>
                <rect x="600" y="158" width="200" height="5"/>
                <rect x="600" y="172" width="200" height="7"/>
                <rect x="600" y="188" width="200" height="9"/>
            </g>
        </g>

        <!-- perspective grid floor -->
        <g mask="url(#gridFade)">
            <g stroke="#05d9e8" stroke-width="1" opacity=".7">
                <line x1="6" y1="206" x2="894" y2="206"/>
                <line x1="6" y1="214" x2="894" y2="214"/>
                <line x1="6" y1="225" x2="894" y2="225"/>
                <line x1="6" y1="240" x2="894" y2="240"/>
                <line x1="6" y1="259" x2="894" y2="259" class="flow"/>
                <line x1="6" y1="282" x2="894" y2="282"/>
            </g>
            <g stroke="#ff2a6d" stroke-width="1" opacity=".6">
                <line x1="450" y1="200" x2="-310" y2="300"/>
                <line x1="450" y1="200" x2="-70"  y2="300"/>
                <line x1="450" y1="200" x2="110"  y2="300"/>
                <line x1="450" y1="200" x2="250"  y2="300"/>
                <line x1="450" y1="200" x2="360"  y2="300"/>
                <line x1="450" y1="200" x2="540"  y2="300"/>
                <line x1="450" y1="200" x2="650"  y2="300"/>
                <line x1="450" y1="200" x2="790"  y2="300"/>
                <line x1="450" y1="200" x2="970"  y2="300"/>
                <line x1="450" y1="200" x2="1210" y2="300"/>
            </g>
        </g>
        <!-- horizon -->
        <line x1="6" y1="200" x2="894" y2="200" stroke="#ff2a6d" stroke-width="1.2" opacity=".9" filter="url(#glow)"/>

        <!-- neon frame accent -->
        <rect x="16" y="16" width="868" height="268" rx="4" fill="none" stroke="#05d9e8" stroke-width="1" opacity=".35"/>

        <!-- WORDMARK with chromatic aberration -->
        <g filter="url(#glow)">
            <text class="name cyan gC"  x="56" y="126">Less code</text>
            <text class="name pink gP"  x="56" y="126">Less code</text>
            <text class="name white"    x="56" y="126">Less code</text>
        </g>
        <!-- glitch slice -->
        <g clip-path="url(#sliceClip)">
            <text class="name pink slice" x="56" y="126">Less code</text>
        </g>

        <text class="tag" x="60" y="160" filter="url(#glow)">OPEN SOURCE &#183; LOW-CODE</text>
        <text class="sub" x="60" y="188" filter="url(#glow)">&#8250; creator of <tspan class="white" font-weight="700">erupt</tspan> &amp; <tspan class="white" font-weight="700">linq.j</tspan><tspan class="cursor"> &#9608;</tspan></text>

        <!-- scanline overlay -->
        <rect x="6" y="6" width="888" height="288" fill="url(#scan)"/>
    </g>
</svg>
