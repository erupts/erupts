<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="YuePeng — open source · low-code">
    <style>
        text { font-family: ui-monospace, 'SFMono-Regular', Menlo, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }

        .name  { font-size: 76px; font-weight: 800; letter-spacing: 2px; }
        .tag   { font-size: 14px; letter-spacing: 7px; fill: #05d9e8; }
        .sub   { font-size: 16px; letter-spacing: 1px; fill: #ff2a6d; }

        .cyan  { fill: #05d9e8; }
        .pink  { fill: #ff2a6d; }
        .white { fill: #eafcff; }

        /* glitch: the offset color-split copies jitter horizontally */
        .gC { animation: gC 2.6s steps(1) infinite; }
        .gP { animation: gP 2.6s steps(1) infinite; }
        @keyframes gC {
            0%,88%,100% { transform: translateX(-3px); }
            90% { transform: translate(-9px,2px); }
            94% { transform: translate(2px,-2px); }
        }
        @keyframes gP {
            0%,88%,100% { transform: translateX(3px); }
            90% { transform: translate(8px,-2px); }
            94% { transform: translate(-3px,2px); }
        }

        /* glitch slice — a clipped band of the name flickers sideways */
        .slice { animation: slice 3.4s steps(1) infinite; }
        @keyframes slice {
            0%,92%,100% { transform: translateX(0); opacity: 0; }
            93% { transform: translateX(10px); opacity: 1; }
            96% { transform: translateX(-8px); opacity: 1; }
            98% { opacity: 0; }
        }

        .cursor { fill: #f9f002; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .flow { stroke-dasharray: 4 10; animation: flow 3s linear infinite; }
        @keyframes flow { to { stroke-dashoffset: -28; } }
    </style>

    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#0d0221"/>
            <stop offset=".55" stop-color="#160a2e"/>
            <stop offset="1"   stop-color="#24063d"/>
        </linearGradient>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ff2a6d" stop-opacity=".9"/>
            <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="4" fill="#000" opacity="0"/>
            <rect width="4" height="1.4" fill="#000" opacity=".28"/>
        </pattern>
        <clipPath id="panelClip"><rect x="6" y="6" width="888" height="288" rx="14"/></clipPath>
        <clipPath id="sliceClip"><rect x="0" y="118" width="520" height="16"/></clipPath>
    </defs>

    <!-- panel -->
    <rect x="6" y="6" width="888" height="288" rx="14" fill="url(#sky)" stroke="#ff2a6d" stroke-width="1.5"/>

    <g clip-path="url(#panelClip)">
        <!-- neon sun glow behind grid -->
        <ellipse cx="640" cy="238" rx="180" ry="120" fill="url(#sun)"/>

        <!-- perspective grid floor -->
        <g stroke="#05d9e8" stroke-width="1" opacity=".55">
            <!-- horizontals (perspective spacing) -->
            <line x1="6" y1="232" x2="894" y2="232"/>
            <line x1="6" y1="242" x2="894" y2="242"/>
            <line x1="6" y1="256" x2="894" y2="256"/>
            <line x1="6" y1="274" x2="894" y2="274" class="flow"/>
            <line x1="6" y1="296" x2="894" y2="296"/>
        </g>
        <g stroke="#ff2a6d" stroke-width="1" opacity=".5">
            <!-- verticals converging to vanishing point (450,232) -->
            <line x1="450" y1="232" x2="-260" y2="300"/>
            <line x1="450" y1="232" x2="60"   y2="300"/>
            <line x1="450" y1="232" x2="230"  y2="300"/>
            <line x1="450" y1="232" x2="360"  y2="300"/>
            <line x1="450" y1="232" x2="540"  y2="300"/>
            <line x1="450" y1="232" x2="670"  y2="300"/>
            <line x1="450" y1="232" x2="840"  y2="300"/>
            <line x1="450" y1="232" x2="1160" y2="300"/>
        </g>

        <!-- neon frame accents -->
        <rect x="16" y="16" width="868" height="268" rx="10" fill="none" stroke="#05d9e8" stroke-width="1" opacity=".35"/>
        <rect x="40" y="70" width="6" height="120" class="pink" filter="url(#glow)"/>

        <!-- WORDMARK with chromatic aberration -->
        <g filter="url(#glow)">
            <text class="name cyan gC"  x="66" y="150">YuePeng</text>
            <text class="name pink gP"  x="66" y="150">YuePeng</text>
            <text class="name white"    x="66" y="150">YuePeng</text>
        </g>
        <!-- glitch slice -->
        <g clip-path="url(#sliceClip)">
            <text class="name pink slice" x="66" y="150">YuePeng</text>
        </g>

        <text class="tag" x="70" y="184" filter="url(#glow)">OPEN SOURCE &#183; LOW-CODE</text>
        <text class="sub" x="70" y="218" filter="url(#glow)">&#8250; creator of <tspan class="white" font-weight="700">erupt</tspan> &amp; <tspan class="white" font-weight="700">linq.j</tspan><tspan class="cursor"> &#9608;</tspan></text>

        <!-- scanline overlay -->
        <rect x="6" y="6" width="888" height="288" fill="url(#scan)"/>
    </g>
</svg>
